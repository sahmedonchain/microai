  <circle cx="1026" cy="60" r="6" fill="#22D3EE"/>
  <text x="1044" y="67" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#9fe9f7">Live on Arc Mainnet</text>
