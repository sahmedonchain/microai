  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1140" cy="30" r="200" fill="#1D4FFF" opacity="0.10"/>
  <circle cx="1230" cy="310" r="140" fill="#A855F7" opacity="0.10"/>

  <!-- main logo, scaled from the 512 x 512 mark -->
  <g transform="translate(80 85) scale(0.3125)">
    <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#tile)" stroke="url(#b)" stroke-width="6"/>
    <g transform="translate(-71.25 -15.15) scale(0.85)" fill="url(#g)" stroke="url(#g)" stroke-width="6" stroke-linejoin="round">
      <polygon points="222,197 362,277 367,285 367,385 307,385 307,345 222,272"/>
      <polygon points="222,328 307,385 307,441 222,441"/>
      <polygon points="548,197 408,277 403,285 403,385 463,385 463,345 548,272"/>
      <polygon points="548,328 463,385 463,441 548,441"/>
    </g>
  </g>

  <text x="270" y="150" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff">MicroAI</text>
  <text x="272" y="198" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#9fd8ff">Inspect, verify and debug USDC and x402 payments on Arc</text>
  <text x="272" y="244" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#8b93b8">Read-only tools for developers and AI agents. Early preview.</text>

