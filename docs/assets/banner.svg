<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="MicroAI: inspect, verify and debug USDC and x402 payments on Arc">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="222" y1="441" x2="548" y2="197">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#1D4FFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="tile" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0E1530"/>
      <stop offset="1" stop-color="#050816"/>
