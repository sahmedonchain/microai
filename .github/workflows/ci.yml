name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (app, lib, tests)
        run: pnpm exec eslint app lib tests
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders only. Nothing here is used to reach real services.
          GROQ_API_KEY: ci-placeholder
          UPSTASH_REDIS_REST_URL: https://example.invalid
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder
          SESSION_SECRET: ci-placeholder-secret
